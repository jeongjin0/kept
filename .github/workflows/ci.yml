name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run zip
      - run: node scripts/check-package.mjs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: extension-zip
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 30
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: e2e-failure
          path: test-results/
          if-no-files-found: ignore

  minimum-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install-deps chromium
        timeout-minutes: 30
      - name: Install Chrome for Testing 120
        timeout-minutes: 10
        run: |
          browser_dir="$RUNNER_TEMP/scrollplus-chrome-120"
          mkdir -p "$browser_dir"
          curl --fail --location --retry 3 --output "$browser_dir/chrome.zip" \
            https://storage.googleapis.com/chrome-for-testing-public/120.0.6099.109/linux64/chrome-linux64.zip
          unzip -q "$browser_dir/chrome.zip" -d "$browser_dir"
          executable="$browser_dir/chrome-linux64/chrome"
          actual_version="$("$executable" --version)"
          [[ "$actual_version" == *"120.0.6099.109"* ]]
          printf '%s\n' "$actual_version"
          printf 'SCROLLPLUS_CHROME_EXECUTABLE=%s\n' "$executable" >> "$GITHUB_ENV"
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: minimum-chrome-failure
          path: test-results/
          if-no-files-found: ignore
